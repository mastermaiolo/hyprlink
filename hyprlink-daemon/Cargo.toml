[package]
name = "hyprlink-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ciborium = "0.2.2"
dirs = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
iced = { version = "0.14.0", features = ["image", "tokio", "advanced"] }
image = { version = "0.25.10", default-features = false }
ksni = "0.3.6"
qrcode = "0.14.1"
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.10"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rustls = { version = "0.23.43", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
uinput = { version = "0.1.3", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
