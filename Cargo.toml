[workspace]
resolver = "3"
members = [
    "crates/hyprlink-proto",
    "crates/hyprlinkd",
    "crates/hyprlink-gui",
    "crates/hyprlinkctl",
]
[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
hyprlink-proto = { path = "crates/hyprlink-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2.2"

[profile.release]
# Sem isso, overflow de inteiro em release faz wraparound silencioso em vez
# de panicar — cálculo de tamanho de pacote/buffer errado vira corrupção
# silenciosa de dados em vez de um crash detectável.
overflow-checks = true
lto = "thin"
codegen-units = 4
strip = true

# Para ITERAR (`cargo build --profile fast -p hyprlinkd`): herda do release mas
# sem LTO, com mais unidades de codegen e sem verificação de overflow.
# **NÃO é para distribuir** — o `overflow-checks = true` do `release` acima é
# deliberado e fica como está; aqui desliga-se só para compilar mais depressa.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
overflow-checks = false
debug = false

# A GUI (iced, tiny-skia) fica usável em debug.
[profile.dev.package."*"]
opt-level = 2
