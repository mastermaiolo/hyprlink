<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#111419"/><stop offset="1" stop-color="#050607"/></linearGradient>
  <radialGradient id="cyanglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00D2FF" stop-opacity=".22"/><stop offset="1" stop-color="#00D2FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B62B32" stop-opacity=".32"/><stop offset="1" stop-color="#B62B32" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="356" rx="18" fill="#0B0D0F" stroke="#2A2D31" stroke-width="1"/>
<rect x="3" y="3" width="1194" height="354" fill="url(#grid)"/>

<!-- Glowing fields -->
<ellipse cx="940" cy="140" rx="240" ry="150" fill="url(#cyanglow)" filter="url(#blur)"/>
<ellipse cx="1060" cy="100" rx="160" ry="120" fill="url(#redglow)" filter="url(#blur)"/>

<!-- Convergence / Dual-device signal abstraction -->
<circle cx="950" cy="155" r="120" fill="none" stroke="#2A2D31" stroke-width="1" stroke-dasharray="4 6"/>
<circle cx="950" cy="155" r="90" fill="none" stroke="#00D2FF" stroke-opacity=".2" stroke-width="1.5"/>
<circle cx="950" cy="155" r="55" fill="none" stroke="#B62B32" stroke-opacity=".35" stroke-width="1.5"/>

<!-- Desktop Frame abstraction -->
<rect x="760" y="80" width="180" height="120" rx="8" fill="#111419" stroke="#38BDF8" stroke-width="1.5" stroke-opacity=".7"/>
<rect x="772" y="92" width="156" height="84" rx="4" fill="#050607" stroke="#2A2D31" stroke-width="1"/>
<line x1="850" y1="200" x2="850" y2="230" stroke="#38BDF8" stroke-width="2" stroke-opacity=".7"/>
<line x1="810" y1="230" x2="890" y2="230" stroke="#38BDF8" stroke-width="2" stroke-opacity=".7"/>
<!-- Windows inside desktop -->
<rect x="780" y="100" width="70" height="40" rx="3" fill="#1A1F26" stroke="#2A2D31" stroke-width="1"/>
<rect x="856" y="100" width="64" height="68" rx="3" fill="#12161C" stroke="#2A2D31" stroke-width="1"/>
<text x="786" y="114" font-family="JetBrains Mono, monospace" font-size="7px" fill="#00D2FF">hyprland</text>
<text x="862" y="114" font-family="JetBrains Mono, monospace" font-size="7px" fill="#8E8A82">iced-gui</text>

<!-- Phone Frame abstraction -->
<rect x="990" y="95" width="80" height="145" rx="14" fill="#111419" stroke="#B62B32" stroke-width="1.5" stroke-opacity=".85"/>
<rect x="998" y="107" width="64" height="121" rx="8" fill="#050607" stroke="#2A2D31" stroke-width="1"/>
<!-- Phone notch & button -->
<circle cx="1030" cy="102" r="2.5" fill="#2A2D31"/>
<rect x="1004" y="116" width="52" height="30" rx="4" fill="#181B20"/>
<text x="1010" y="128" font-family="JetBrains Mono, monospace" font-size="6.5px" fill="#E9E5DC">HyprLink</text>
<text x="1010" y="139" font-family="JetBrains Mono, monospace" font-size="5.5px" fill="#00D2FF">CONNECTED</text>

<!-- QUIC / CBOR packet stream waves -->
<path d="M 875 140 C 920 110, 950 110, 990 140" fill="none" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<path d="M 875 155 C 920 180, 950 180, 990 155" fill="none" stroke="#B62B32" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="935" cy="122" r="3.5" fill="#00D2FF"/>
<circle cx="945" cy="168" r="3" fill="#B62B32"/>

<!-- Wire protocol markers -->
<rect x="888" y="196" width="104" height="22" rx="5" fill="#111419" stroke="#2A2D31" stroke-width="1"/>
<text x="940" y="210" font-family="JetBrains Mono, monospace" font-size="8px" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1">QUIC · 7443/UDP</text>

<!-- Corner framing brackets -->
<line x1="38" y1="35" x2="112" y2="35" stroke="#4D5156" stroke-width="1"/>
<line x1="38" y1="35" x2="38" y2="76" stroke="#4D5156" stroke-width="1"/>
<line x1="1088" y1="35" x2="1162" y2="35" stroke="#4D5156" stroke-width="1"/>
<line x1="1162" y1="35" x2="1162" y2="76" stroke="#4D5156" stroke-width="1"/>
<line x1="38" y1="325" x2="112" y2="325" stroke="#4D5156" stroke-width="1"/>
<line x1="38" y1="284" x2="38" y2="325" stroke="#4D5156" stroke-width="1"/>

<!-- Typography -->
<text x="58" y="77" font-family="JetBrains Mono, monospace" font-size="13px" font-weight="600" fill="#8E8A82" letter-spacing="3">HL / 01</text>
<text x="58" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="46px" font-weight="700" fill="#E9E5DC" letter-spacing="9">H Y P R L I N K</text>
<text x="60" y="176" font-family="JetBrains Mono, monospace" font-size="13px" font-weight="600" fill="#8E8A82" letter-spacing="2">ANDROID ⇄ HYPRLAND ECOSYSTEM INTEGRATION</text>
<text x="60" y="224" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="400" fill="#E9E5DC" letter-spacing="1">QUIC  ·  mTLS  ·  CBOR  ·  CONTINUITY  ·  UINPUT  ·  PIPEWIRE  ·  ICED</text>
<text x="60" y="252" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="400" fill="#8E8A82" letter-spacing="1">LOCAL UDP 7443  /  ZERO RELAY  /  DIRECT WIRE TRANSPORT</text>
<text x="60" y="310" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#8E8A82" letter-spacing="2">MAIOLO / SYSTEMS LAB</text>

<!-- Signature mark -->
<text x="1115" y="308" font-family="Georgia, Times New Roman, serif" font-size="22px" font-weight="700" fill="#B62B32" text-anchor="middle">食</text>
<text x="1115" y="328" font-family="JetBrains Mono, monospace" font-size="9px" font-weight="500" fill="#8E8A82" text-anchor="middle" letter-spacing="2">DEVICE BRIDGE</text>

<!-- Micro signal dots -->
<circle cx="705" cy="63" r="2.6" fill="#00D2FF" opacity="0.9"/>
<circle cx="730" cy="63" r="2.6" fill="#B62B32" opacity="0.9"/>
<circle cx="755" cy="63" r="2.6" fill="#8E8A82" opacity="0.4"/>
</svg>
