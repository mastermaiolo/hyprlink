<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" width="1200" height="365">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="361" rx="16" fill="#0B0D0F" stroke="#2A2D31" stroke-width="1"/>
<rect x="3" y="3" width="1194" height="359" fill="url(#grid)"/>

<!-- Header -->
<text x="28" y="34" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="600" fill="#8E8A82" letter-spacing="2">05 / CONTROL SURFACE</text>
<text x="1170" y="34" font-family="JetBrains Mono, monospace" font-size="10px" font-weight="600" fill="#38BDF8" text-anchor="end" letter-spacing="2">ICED GUI + HYPRLINKCTL</text>

<!-- Left Card: GUI Keyboard Map (width: 320) -->
<rect x="28" y="58" width="320" height="254" rx="12" fill="#111419" stroke="#2A2D31" stroke-width="1"/>
<text x="48" y="84" font-family="JetBrains Mono, monospace" font-size="10px" font-weight="600" fill="#8E8A82" letter-spacing="2">DESKTOP APP NAVIGATION</text>

<!-- Key 1..9 -->
<rect x="48" y="102" width="60" height="38" rx="6" fill="#15181C" stroke="#2A2D31" stroke-width="1"/>
<text x="78" y="126" font-family="JetBrains Mono, monospace" font-size="14px" font-weight="700" fill="#E9E5DC" text-anchor="middle">1 – 9</text>
<text x="122" y="120" font-family="JetBrains Mono, monospace" font-size="10px" font-weight="600" fill="#00D2FF" letter-spacing="1">PAGE JUMP</text>
<text x="122" y="133" font-family="Inter, Segoe UI, sans-serif" font-size="9px" fill="#8E8A82">Cover · Devices · Desk · Media...</text>

<!-- Key 0 -->
<rect x="48" y="152" width="60" height="38" rx="6" fill="#15181C" stroke="#2A2D31" stroke-width="1"/>
<text x="78" y="176" font-family="JetBrains Mono, monospace" font-size="14px" font-weight="700" fill="#E9E5DC" text-anchor="middle">0</text>
<text x="122" y="170" font-family="JetBrains Mono, monospace" font-size="10px" font-weight="600" fill="#00D2FF" letter-spacing="1">SETTINGS</text>
<text x="122" y="183" font-family="Inter, Segoe UI, sans-serif" font-size="9px" fill="#8E8A82">Preferences &amp; config overlay</text>

<!-- Pages list summary -->
<line x1="48" y1="205" x2="328" y2="205" stroke="#2A2D31" stroke-width="1"/>
<text x="48" y="225" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82">1:Cover  2:Devices  3:Desk  4:Camera</text>
<text x="48" y="243" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82">5:Audio  6:Notifs   7:Share 8:Media</text>
<text x="48" y="261" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82">9:Sensors &amp; Presence        0:Settings</text>
<text x="48" y="292" font-family="JetBrains Mono, monospace" font-size="9px" font-weight="600" fill="#38BDF8">5 Languages: EN-GB · PT · ES · ZH</text>

<!-- Right Card: CLI Command List (width: 800) -->
<rect x="370" y="58" width="800" height="254" rx="12" fill="#111419" stroke="#2A2D31" stroke-width="1"/>
<text x="390" y="84" font-family="JetBrains Mono, monospace" font-size="10px" font-weight="600" fill="#8E8A82" letter-spacing="2">UNIX CLI / SCRIPTING SURFACE</text>

<!-- CLI commands -->
<text x="390" y="112" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl status</text>
<text x="1145" y="112" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">CONNECTION STATE</text>

<text x="390" y="137" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl watch --json</text>
<text x="1145" y="137" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">STREAM JSON TELEMETRY</text>

<text x="390" y="162" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl clipboard</text>
<text x="1145" y="162" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">SYNC CLIPBOARD BUFFER</text>

<text x="390" y="187" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl pair</text>
<text x="1145" y="187" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">OPEN 120s PAIRING WINDOW</text>

<text x="390" y="212" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl mirror toggle</text>
<text x="1145" y="212" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">TOGGLE SCREEN MIRROR</text>

<text x="390" y="237" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl mic | tap | speaker toggle</text>
<text x="1145" y="237" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">AUDIO RELAY CONTROL</text>

<text x="390" y="262" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl ws 3</text>
<text x="1145" y="262" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">DISPATCH HYPRLAND WORKSPACE</text>

<text x="390" y="287" font-family="JetBrains Mono, monospace" font-size="11px" fill="#E9E5DC">$ hyprlinkctl doctor</text>
<text x="1145" y="287" font-family="JetBrains Mono, monospace" font-size="9px" fill="#8E8A82" text-anchor="end">COMPATIBILITY &amp; SYS REPORT</text>

<!-- Footer rule -->
<line x1="370" y1="326" x2="1170" y2="326" stroke="#00D2FF" stroke-width="1" opacity="0.7"/>
<text x="370" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="10px" fill="#8E8A82">Talks directly to $XDG_RUNTIME_DIR/hyprlink.sock · ideal for Waybar, keybindings and scripts</text>
</svg>
