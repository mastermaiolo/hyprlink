<text x="346" y="82" font-family="JetBrains Mono, monospace" font-size="9px" font-weight="700" fill="#00D2FF" letter-spacing="2">SHARED CONTRACT</text>
<text x="346" y="106" font-family="JetBrains Mono, monospace" font-size="14px" font-weight="600" fill="#E9E5DC">hyprlink-proto</text>
<text x="346" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9.5px" fill="#8E8A82">CBOR framing · wire types · RPC schema</text>

<!-- Arrow 2 -->
<text x="605" y="112" font-family="Georgia, serif" font-size="20px" fill="#8E8A82">→</text>

