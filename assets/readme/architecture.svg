<rect x="632" y="62" width="260" height="88" rx="12" fill="#111419" stroke="#2A2D31" stroke-width="1"/>
<text x="648" y="82" font-family="JetBrains Mono, monospace" font-size="9px" font-weight="700" fill="#00D2FF" letter-spacing="2">USER SURFACES</text>
<text x="648" y="106" font-family="JetBrains Mono, monospace" font-size="14px" font-weight="600" fill="#E9E5DC">gui + hyprlinkctl</text>
<text x="648" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9.5px" fill="#8E8A82">Iced desktop app · tray icon · UNIX CLI</text>

<!-- Arrow 3 -->
<text x="907" y="112" font-family="Georgia, serif" font-size="20px" fill="#8E8A82">→</text>

