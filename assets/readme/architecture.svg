<!-- Bottom Metadata Bar -->
<line x1="140" y1="274" x2="1060" y2="274" stroke="#2A2D31" stroke-width="1"/>
<text x="140" y="296" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#8E8A82">IPC: $XDG_RUNTIME_DIR/hyprlink.sock</text>
<text x="600" y="296" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#8E8A82" text-anchor="middle">WIRE: 7443/UDP QUIC (CBOR + DATAGRAM)</text>
<text x="1060" y="296" font-family="JetBrains Mono, monospace" font-size="9.5px" fill="#8E8A82" text-anchor="end">CONFIG: ~/.config/hyprlink/</text>
</svg>
