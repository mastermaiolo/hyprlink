<text x="44" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9.5px" fill="#8E8A82">QUIC/mTLS server · 7443/UDP · zero UI</text>

<!-- Arrow 1 -->
<text x="303" y="112" font-family="Georgia, serif" font-size="20px" fill="#8E8A82">→</text>

