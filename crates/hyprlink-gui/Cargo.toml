[package]
name = "hyprlink-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HYPRLINK — a GUI iced do HyprLink (iced::daemon + tray StatusNotifierItem)"

[features]
# O simulador vem compilado por omissão para trabalho de design e capturas
# (HYPRLINK_MOCK=1); em uso normal a GUI fala com o hyprlinkd pelo socket.
default = ["mock"]
mock = ["hyprlink-proto/mock"]

[dependencies]
hyprlink-proto = { workspace = true, features = ["fmt"] }
iced = { version = "0.14.0", features = ["canvas", "tokio", "qr_code"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ksni = "0.3.6"
tokio = { version = "1", features = ["net", "io-util", "time"] }
serde_json.workspace = true
serde.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Lints tolerados (herdados do desenho original):
#   - collapsible_if: app.rs, atalhos de teclado em ifs aninhados;
#   - if_same_then_else: theme.rs `card()`, ramos selected/hovered com a
#     mesma cor de propósito.
[lints.clippy]
collapsible_if = "allow"
if_same_then_else = "allow"
unnecessary_sort_by = "allow"
clone_on_copy = "allow"
