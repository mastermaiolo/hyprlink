[package]
name = "hyprlinkd"
version.workspace = true
edition.workspace = true
license.workspace = true

# O daemon corre sem janela; a interface é o `hyprlink-gui`. O binário mantém
# o nome `hyprlink-daemon` para não partir o `exec-once` nem o contrib/.
[[bin]]
name = "hyprlink-daemon"
path = "src/main.rs"

[dependencies]
hyprlink-proto.workspace = true
anyhow = "1.0.104"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ciborium = "0.2.2"
dirs = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
qrcode = "0.14.1"
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.10"
rustix = { version = "1", default-features = false, features = ["fs"] }
rustls = { version = "0.23.43", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
uinput = { version = "0.1.3", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

