[package]
name = "hyprlink-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Contrato entre o hyprlinkd, a GUI e o hyprlinkctl: Command/Event, JSON v1, nomes de pacotes"

[features]
default = []
# Daemon simulado (trabalho de design, capturas, plugin sem telemóvel).
mock = []
# Textos para humanos no idioma atual (fonte pt-PT) e o módulo i18n. Só a GUI
# e o hyprlinkctl; o daemon nunca.
fmt = ["dep:chrono"]

[dependencies]
serde.workspace = true
ciborium.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }

[dev-dependencies]
# Os testes de integração usam o simulador como fonte de eventos reais.
hyprlink-proto = { path = ".", features = ["mock"] }
serde_json.workspace = true

# Lints tolerados (herdados do desenho original):
#   - large_enum_variant: Event::Phone (~280 B); o wire não muda e os eventos
#     são descodificados um a um.
[lints.clippy]
collapsible_if = "allow"
manual_is_multiple_of = "allow"
large_enum_variant = "allow"
unnecessary_sort_by = "allow"
