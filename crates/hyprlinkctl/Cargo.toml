[package]
name = "hyprlinkctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI do HyprLink: texto (ok …/erro: …) para scripts antigos, JSON v1 com --json"

[features]
# A metade JSON fala com o daemon real. O simulador (`mock`) só entra com
# `HYPRLINK_MOCK=1` ou `--mock` (capturas, fixtures do plugin, testes); a
# feature fica ligada por omissão para esse modo existir no binário.
default = ["mock"]
mock = ["hyprlink-proto/mock"]

[dependencies]
hyprlink-proto = { workspace = true, features = ["fmt"] }
hyprlink-env.workspace = true
serde.workspace = true
serde_json.workspace = true
