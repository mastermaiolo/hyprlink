[package]
name = "hyprlinkctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI do HyprLink: texto (ok …/erro: …) para scripts antigos, JSON v1 com --json"

[features]
# A metade JSON fala com o simulador até o socket real existir (Fase 3).
default = ["mock"]
mock = ["hyprlink-proto/mock"]

[dependencies]
hyprlink-proto = { workspace = true, features = ["fmt"] }
hyprlink-env.workspace = true
serde.workspace = true
serde_json.workspace = true
